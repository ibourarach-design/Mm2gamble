<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM2Gamble</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="logo">MM2GAMBLE</div>
  <div class="balance">💎 0</div>
</div>

<div class="container">
  <div class="banner">
    <h2>Coinflip is now active!</h2>
    <p>Play now and win items.</p>
  </div>

  <div class="card">
    <h1>68</h1>
    <p>Total Items</p>
  </div>

  <div class="card">
    <h1>7,997</h1>
    <p>Total Value</p>
  </div>

  <div class="card">
    <h1>3</h1>
    <p>Active Games</p>
  </div>

  <div class="buttons">
    <button class="green">Create</button>
    <button class="dark">History</button>
  </div>

  <div class="gamemode">
    MM2 COINFLIP
  </div>

  <div class="battle">
    <div class="player blue">BLEU</div>
    <div class="vs">VS</div>
    <div class="player yellow">JAUNE</div>
  </div>
</div>

<div class="navbar">
  <button onclick="openMenu()">☰</button>
  <button onclick="openGames()">🎰</button>
  <button onclick="openChat()">💬</button>
</div>

<script src="script.js"></script>
</body>
</html>
